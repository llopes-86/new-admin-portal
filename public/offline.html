<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão — Admin M&L</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .offline-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-sand);
    }
    .offline-card {
      text-align: center;
      max-width: 340px;
      padding: 48px 32px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(184,92,56,0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .offline-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .offline-card h1 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--color-brown);
      margin-bottom: 8px;
    }
    .offline-card p {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    .offline-card .btn {
      display: inline-block;
    }
  </style>
</head>
<body class="offline-page">
  <div class="offline-card">
    <div class="offline-icon">
      <img src="images/Sankofa.png" alt="Sankofa">
    </div>
    <h1>Sem Conexão</h1>
    <p>Verifique sua internet e tente novamente.</p>
  </div>
  <script src="js/sw-register.js"></script>
</body>
</html>
