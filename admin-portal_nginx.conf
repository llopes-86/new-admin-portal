# /etc/nginx/conf.d/admin-portal.conf

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    keepalive_timeout 60;
    send_timeout 30;

    # ------------------------------------------------------------------
    # SEGURANCA
    # ------------------------------------------------------------------
    # OBS: add_header nao e herdado quando o location tem add_header proprio.
    # Por isso os cabecalhos sao repetidos inline em cada location abaixo.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ------------------------------------------------------------------
    # REGRAS DE BLOQUEIO (Scans / Path Traversal)
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
    }

    location ~* \.(php|sql|bak|old|ini|conf|sh|env|cgi|log|swp|tmp)$ {
        deny all;
    }

    # ------------------------------------------------------------------
    # PROXY POCKETBASE (SDK adiciona /api/ automaticamente)
    # /api/pb/api/collections/... -> websites_pocketbase:80/api/collections/...
    # ------------------------------------------------------------------
    location /api/pb/api/ {
        limit_req zone=api_limit burst=30 nodelay;

        # Permitir apenas os metodos usados pelo admin (GET leitura, POST create/login, PATCH update)
        limit_except GET POST PATCH {
            deny all;
        }

        proxy_pass http://websites_pocketbase:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Impedir cache de respostas da API
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;

        proxy_buffers 4 32k;
        proxy_buffer_size 16k;
    }

    # ------------------------------------------------------------------
    # ARQUIVOS ESTATICOS (sem cache - dados sensiveis)
    # ------------------------------------------------------------------
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;

        try_files $uri $uri/ /index.html;
    }
}
